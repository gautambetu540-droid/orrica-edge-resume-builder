name: Fix template showcase theme
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply theme cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          s=p.read_text()
          old='className="relative overflow-hidden bg-[linear-gradient(180deg,#f8fbfd_0%,#f3f7fa_100%)] py-12 text-slate-900 sm:py-16 lg:py-20"'
          new='className="relative overflow-hidden bg-[linear-gradient(180deg,#fff8f1_0%,#fffaf7_52%,#fff3e8_100%)] py-12 text-neutral-900 sm:py-16 lg:py-20"'
          s=s.replace(old,new,1)
          s=s.replace('bg-[radial-gradient(circle_at_50%_0%,rgba(249,115,22,.12),transparent_42%)]','bg-[radial-gradient(circle_at_50%_0%,rgba(249,115,22,.16),transparent_42%)]',1)
          s=s.replace('text-slate-950 sm:text-4xl lg:text-[50px]','text-neutral-950 sm:text-4xl lg:text-[50px]',1)
          needle='<div className="relative mx-auto max-w-[1500px] px-5 sm:px-8 lg:px-10">'
          replacement='<div className="relative mx-auto max-w-[1500px] px-5 sm:px-8 lg:px-10 [&_[class*="text-sky-"]]:!text-orange-600 [&_[class*="text-blue-"]]:!text-orange-600 [&_[class*="text-teal-"]]:!text-orange-600 [&_[class*="border-sky-"]]:!border-orange-200 [&_[class*="border-blue-"]]:!border-orange-200 [&_[class*="border-teal-"]]:!border-orange-200 [&_[class*="bg-sky-"]]:!bg-orange-50 [&_[class*="bg-blue-"]]:!bg-orange-50 [&_[class*="bg-teal-"]]:!bg-orange-50">'
          s=s.replace(needle,replacement,1)
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx
          git rm -f .github/workflows/fix-template-showcase-theme.yml .template-showcase-theme-trigger
          git commit -m 'fix: finalize orange template showcase theme'
          git push
