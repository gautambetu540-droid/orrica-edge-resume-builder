name: Fix feedback names and orange theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: finalize feedback names and orange theme') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final feedback and theme fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path('app/page.tsx')
          text = page.read_text()

          text = text.replace(
              "const [items, setItems] = useState<Array<{ id: string; rating: number; feedback: string }>>([]);",
              "const [items, setItems] = useState<Array<{ id: string; rating: number; feedback: string; candidateName?: string }>>([]);"
          )

          old_section = 'className="border-y border-black/[0.06] bg-white py-20 sm:py-28"'
          new_section = 'className="relative overflow-hidden border-y border-orange-100 bg-[linear-gradient(180deg,#fffaf6_0%,#ffffff_55%,#fff7f0_100%)] py-20 sm:py-28"'
          text = text.replace(old_section, new_section, 1)

          old_wrap = '<div className="mx-auto max-w-3xl text-center">\n          <div className="inline-flex items-center gap-2 rounded-full border border-orange-100 bg-orange-50/70 px-3 py-1.5 text-[10px] font-black uppercase tracking-[0.16em] text-orange-700"><Sparkles className="h-3.5 w-3.5" /> Candidate feedback</div>'
          new_wrap = '<div className="mx-auto max-w-3xl text-center">\n          <div className="inline-flex items-center gap-2 rounded-full border border-orange-200 bg-orange-50 px-3 py-1.5 text-[10px] font-black uppercase tracking-[0.16em] text-orange-700"><Sparkles className="h-3.5 w-3.5" /> Candidate feedback</div>'
          text = text.replace(old_wrap, new_wrap, 1)

          text = text.replace(
              '<p className="mx-auto mt-4 max-w-2xl text-sm leading-7 text-neutral-500 sm:text-base">Real feedback from candidates helps us keep the experience faster, clearer and more useful.</p>',
              '<p className="mx-auto mt-4 max-w-2xl text-sm leading-7 text-orange-800/75 sm:text-base">Real feedback from candidates helps us build a faster, clearer and more useful resume experience.</p>',
              1
          )

          old_identity = '<div className="mt-6 flex items-center gap-3 border-t border-neutral-200 pt-4"><div className="flex h-9 w-9 items-center justify-center rounded-full bg-neutral-950 text-xs font-bold text-white">C</div><div><div className="text-xs font-bold text-neutral-900">Candidate feedback</div><div className="text-[10px] text-neutral-400">Shared after PDF download</div></div></div>'
          new_identity = '<div className="mt-6 flex items-center gap-3 border-t border-orange-100 pt-4"><div className="flex h-9 w-9 items-center justify-center rounded-full bg-orange-500 text-xs font-bold text-white">{(item.candidateName || "Candidate").trim().charAt(0).toUpperCase()}</div><div><div className="text-xs font-bold text-neutral-950">{item.candidateName || "Candidate"}</div><div className="text-[10px] font-medium text-orange-700/70">Candidate · Shared after PDF download</div></div></div>'
          text = text.replace(old_identity, new_identity, 1)

          text = text.replace(
              'className="group relative overflow-hidden rounded-3xl border border-neutral-200 bg-neutral-50 p-6 transition-all duration-300 hover:-translate-y-1 hover:border-orange-200 hover:bg-white hover:shadow-[0_24px_60px_-35px_rgba(15,23,42,.35)]"',
              'className="group relative overflow-hidden rounded-3xl border border-orange-100 bg-white p-6 shadow-[0_18px_45px_-32px_rgba(249,115,22,.28)] transition-all duration-300 hover:-translate-y-1 hover:border-orange-300 hover:bg-white hover:shadow-[0_28px_65px_-35px_rgba(249,115,22,.30)]"',
              1
          )

          # Make the template showcase copy visibly readable and consistently orange-accented.
          text = text.replace(
              'bg-[radial-gradient(circle_at_50%_0%,rgba(14,165,233,.10),transparent_42%)]',
              'bg-[radial-gradient(circle_at_50%_0%,rgba(249,115,22,.12),transparent_42%)]',
              1
          )
          text = text.replace(
              'text-slate-500 sm:text-[15px]">Choose an ATS-friendly, recruiter-ready',
              'text-orange-800/80 sm:text-[15px]">Choose an ATS-friendly, recruiter-ready',
              1
          )
          text = text.replace(
              'text-sky-700 underline decoration-sky-200 decoration-2 underline-offset-4 hover:text-sky-800',
              'text-orange-700 underline decoration-orange-200 decoration-2 underline-offset-4 hover:text-orange-800',
              1
          )
          text = text.replace(
              'border-slate-200 bg-white text-xl font-semibold text-slate-700 shadow-[0_10px_28px_-18px_rgba(15,23,42,.45)] transition hover:-translate-x-0.5 hover:border-sky-200 hover:text-sky-700',
              'border-orange-100 bg-white text-xl font-semibold text-orange-700 shadow-[0_10px_28px_-18px_rgba(249,115,22,.30)] transition hover:-translate-x-0.5 hover:border-orange-300 hover:text-orange-800',
              1
          )
          text = text.replace(
              'border-slate-200 bg-white text-xl font-semibold text-slate-700 shadow-[0_10px_28px_-18px_rgba(15,23,42,.45)] transition hover:translate-x-0.5 hover:border-sky-200 hover:text-sky-700',
              'border-orange-100 bg-white text-xl font-semibold text-orange-700 shadow-[0_10px_28px_-18px_rgba(249,115,22,.30)] transition hover:translate-x-0.5 hover:border-orange-300 hover:text-orange-800',
              1
          )

          page.write_text(text)

          route = Path('app/api/feedback/route.ts')
          text = route.read_text()
          old_insert = "  const { error } = await supabase.from('feedback').insert({\n    user_id: user?.id ?? null,\n    resume_id: parsed.data.resumeId ?? null,\n    rating: parsed.data.rating,\n    feedback: parsed.data.feedback,\n  });"
          new_insert = "  let candidateName = '';\n  if (parsed.data.resumeId && user) {\n    const { data: resume } = await supabase\n      .from('resumes')\n      .select('resume_data')\n      .eq('id', parsed.data.resumeId)\n      .eq('user_id', user.id)\n      .maybeSingle();\n    const personalInfo = (resume?.resume_data as { personalInfo?: { fullName?: string } } | null)?.personalInfo;\n    candidateName = personalInfo?.fullName?.trim() ?? '';\n  }\n\n  const { error } = await supabase.from('feedback').insert({\n    user_id: user?.id ?? null,\n    resume_id: parsed.data.resumeId ?? null,\n    candidate_name: candidateName,\n    rating: parsed.data.rating,\n    feedback: parsed.data.feedback,\n  });"
          if old_insert not in text:
              raise SystemExit('Feedback insert block not found')
          route.write_text(text.replace(old_insert, new_insert, 1))

          public_route = Path('app/api/feedback/public/route.ts')
          text = public_route.read_text()
          text = text.replace(".select('id, rating, feedback, created_at')", ".select('id, candidate_name, rating, feedback, created_at')", 1)
          public_route.write_text(text)
          PY

      - name: Add feedback display name migration
        run: |
          cat > supabase/migrations/0005_feedback_candidate_name.sql <<'SQL'
          -- Store the candidate name captured from the resume used for feedback.
          alter table public.feedback add column if not exists candidate_name text not null default '';

          -- Backfill existing feedback where the linked resume still exists.
          update public.feedback f
          set candidate_name = coalesce(nullif(trim(r.resume_data->'personalInfo'->>'fullName'), ''), '')
          from public.resumes r
          where f.resume_id = r.id
            and coalesce(trim(f.candidate_name), '') = '';
          SQL

      - name: Verify
        run: |
          git diff --check
          git diff -- app/page.tsx app/api/feedback/route.ts app/api/feedback/public/route.ts supabase/migrations/0005_feedback_candidate_name.sql

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/api/feedback/route.ts app/api/feedback/public/route.ts supabase/migrations/0005_feedback_candidate_name.sql
          git rm .github/workflows/fix-feedback-orange-theme.yml
          git commit -m "chore: finalize feedback names and orange theme"
          git push
