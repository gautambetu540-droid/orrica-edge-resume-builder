name: Fix template showcase build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair template showcase JSX
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('app/page.tsx')
          lines = page.read_text().splitlines()
          target = 'className="relative mx-auto max-w-[1500px] px-5 sm:px-8 lg:px-10'
          replacement = '      <div className="template-showcase-inner relative mx-auto max-w-[1500px] px-5 sm:px-8 lg:px-10">'

          for i, line in enumerate(lines):
              if target in line and '[class*=' in line:
                  lines[i] = replacement
                  break
          else:
              raise SystemExit('Invalid template showcase JSX class not found')

          page.write_text('\n'.join(lines) + '\n')
          PY

      - name: Add scoped orange theme
        run: |
          cat >> app/globals.css <<'CSS'

          /* Scoped orange theme for the homepage resume template showcase. */
          .template-showcase-inner [class*="text-sky-"],
          .template-showcase-inner [class*="text-blue-"],
          .template-showcase-inner [class*="text-teal-"] { color: #ea580c !important; }
          .template-showcase-inner [class*="border-sky-"],
          .template-showcase-inner [class*="border-blue-"],
          .template-showcase-inner [class*="border-teal-"] { border-color: #fed7aa !important; }
          .template-showcase-inner [class*="bg-sky-"],
          .template-showcase-inner [class*="bg-blue-"],
          .template-showcase-inner [class*="bg-teal-"] { background-color: #fff7ed !important; }
          CSS

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css
          git rm .github/workflows/fix-template-build.yml
          git commit -m "fix: repair template showcase JSX and orange theme"
          git push
